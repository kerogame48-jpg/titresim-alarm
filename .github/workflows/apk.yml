# Titresimli Alarm - uygulamanin tamami bu dosyada (sikistirilmis).
name: APK derle
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Dosyalari ac
        run: |
          base64 -d > src.tar.xz <<'EOF_SRC'
          
          
          
          
          
          
          
          
          
          
          
          
          
          GqBbRzuQmBCkzMqX7K2FTMr1DPbKWHes2BwytPvUblPhwwl0bp6chLi6/KBsN9pM8R1U75jq1wJla55QAfBGDE1QoDXewC0xCmLtxXu3VpyF7jve7gQtshni1CkrdiMDhmyD0SwAAAAAAEP1JiFwBNx6AAH5TIDgAwAcHF0DscRn+wIAAAAABFla
          EOF_SRC
          mkdir -p src && tar -xJf src.tar.xz -C src
      - name: Imza anahtari
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          if [ ! -f debug.keystore ]; then
            keytool -genkeypair -keystore debug.keystore -storepass android -keypass android -alias androiddebugkey -dname "CN=Android Debug,O=Android,C=US" -keyalg RSA -keysize 2048 -validity 10000
            git add debug.keystore
          fi
          if [ -f .github/workflows/build.yml ]; then git rm -q .github/workflows/build.yml; fi
          git diff --cached --quiet || (git commit -m "Imza anahtari eklendi" && git push)
          mkdir -p ~/.android && cp debug.keystore ~/.android/debug.keystore
      - name: APK derle
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.9-bin.zip
          unzip -q gradle-8.9-bin.zip
          cd src && ../gradle-8.9/bin/gradle assembleDebug --no-daemon --stacktrace
          cp app/build/outputs/apk/debug/app-debug.apk ../TitresimAlarm.apk
      - name: Indirme linkine koy
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "v${{ github.run_number }}" TitresimAlarm.apk --title "Titresimli Alarm surum ${{ github.run_number }}" --notes "TitresimAlarm.apk dosyasina dokunup indir ve kur." --latest
          
