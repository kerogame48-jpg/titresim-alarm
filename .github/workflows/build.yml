          package com.kero.titresimalarm;

          import android.content.BroadcastReceiver;
          import android.content.Context;
          import android.content.Intent;

          /** Alarm zamanı gelince çalışır ve titreşim servisini başlatır. */
          public class AlarmReceiver extends BroadcastReceiver {
              @Override
              public void onReceive(Context ctx, Intent intent) {
                  int id = intent.getIntExtra(Scheduler.EXTRA_ID, -1);
                  boolean snooze = intent.getBooleanExtra(Scheduler.EXTRA_SNOOZE, false);

                  Alarm a = Store.find(ctx, id);
                  if (!snooze && a != null) {
                      if (a.days == 0) {
                          a.enabled = false;
                          Store.put(ctx, a);
                      } else {
                          Scheduler.schedule(ctx, a);
                      }
                  }

                  Intent s = new Intent(ctx, AlarmService.class);
                  s.setAction(AlarmService.ACTION_START);
                  s.putExtra(Scheduler.EXTRA_ID, id);
                  ctx.startForegroundService(s);
              }
          }
          EOF_FILE
          mkdir -p app/src/main/java/com/kero/titresimalarm
          cat > app/src/main/java/com/kero/titresimalarm/AlarmService.java <<'EOF_FILE'
          package com.kero.titresimalarm;

          import android.app.Notification;
          import android.app.NotificationChannel;
          import android.app.NotificationManager;
          import android.app.PendingIntent;
          import android.app.Service;
          import android.content.Context;
          import android.content.Intent;
          import android.os.Handler;
          import android.os.IBinder;
          import android.os.Looper;
          import android.os.PowerManager;

          /**
           * Alarm çalarken önde çalışan servis: sessiz bildirim + güçlü titreşim.
           * Kapat'a ya da Ertele'ye basılana kadar (en fazla 15 dk) titrer.
           */
          public class AlarmService extends Service {
              static final String ACTION_START = "start";
              static final String ACTION_STOP = "stop";
              static final String ACTION_SNOOZE = "snooze";

              private static final String CHANNEL = "alarm_silent_v1";
              private static final int NOTIF_ID = 42;
              private static final long MAX_RING_MS = 15 * 60_000L;
              private static final long REFRESH_MS = 30_000L;

              static volatile boolean ringing = false;
              static volatile int currentId = -1;

              private final Handler handler = new Handler(Looper.getMainLooper());
              private PowerManager.WakeLock wakeLock;

              private final Runnable refresh = new Runnable() {
                  @Override
                  public void run() {
                      // Bazı telefonlar ekran kapanınca titreşimi kesebiliyor; düzenli olarak yeniden başlat.
                      Vib.start(AlarmService.this, Store.pattern(AlarmService.this));
                      handler.postDelayed(this, REFRESH_MS);
                  }
              };

              private final Runnable timeout = this::stopRinging;

              @Override
              public IBinder onBind(Intent intent) {
                  return null;
              }

              @Override
              public int onStartCommand(Intent intent, int flags, int startId) {
                  String action = intent != null ? intent.getAction() : ACTION_START;
                  if (ACTION_STOP.equals(action)) {
                      stopRinging();
                      return START_NOT_STICKY;
                  }
                  if (ACTION_SNOOZE.equals(action)) {
                      int id = currentId;
                      int min = Store.snoozeMinutes(this);
                      stopRinging();
                      Scheduler.snooze(this, id, min);
                      return START_NOT_STICKY;
                  }

                  currentId = intent != null ? intent.getIntExtra(Scheduler.EXTRA_ID, -1) : -1;
                  ringing = true;
                  startForeground(NOTIF_ID, buildNotification());

                  PowerManager pm = (PowerManager) getSystemService(Context.POWER_SERVICE);
                  if (wakeLock == null) {
                      wakeLock = pm.newWakeLock(PowerManager.PARTIAL_WAKE_LOCK, "TitresimAlarm:ring");
                      wakeLock.setReferenceCounted(false);
                  }
                  wakeLock.acquire(MAX_RING_MS + 60_000L);

                  handler.removeCallbacks(refresh);
                  handler.removeCallbacks(timeout);
                  handler.post(refresh);
                  handler.postDelayed(timeout, MAX_RING_MS);

                  try {
             
