# Titreşimli Alarm - bu dosya uygulamanın tamamını içerir.
# GitHub bu dosyayı okuyup APK'yı kendisi derler ve "Releases" kısmına koyar.
name: APK derle

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Uygulama dosyalarini olustur
        run: |
          cat > settings.gradle <<'EOF_FILE'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "TitresimAlarm"
          include ':app'
          EOF_FILE
          cat > build.gradle <<'EOF_FILE'
          plugins {
              id 'com.android.application' version '8.5.2' apply false
          }
          EOF_FILE
          cat > gradle.properties <<'EOF_FILE'
          org.gradle.jvmargs=-Xmx2048m
          android.nonTransitiveRClass=true
          EOF_FILE
          mkdir -p app
          cat > app/build.gradle <<'EOF_FILE'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.kero.titresimalarm'
              compileSdk 34

              defaultConfig {
                  applicationId 'com.kero.titresimalarm'
                  minSdk 26
                  targetSdk 33
                  versionCode 1
                  versionName '1.0'
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          EOF_FILE
          mkdir -p app/src/main
          cat > app/src/main/AndroidManifest.xml <<'EOF_FILE'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

