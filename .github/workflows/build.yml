          package com.kero.titresimalarm;

          import org.json.JSONException;
          import org.json.JSONObject;

          import java.util.Calendar;

          /** Tek bir alarm. days: bit0=Pazartesi ... bit6=Pazar. 0 = tek seferlik. */
          public class Alarm {
              public int id;
              public int hour;
              public int minute;
              public int days;
              public boolean enabled = true;

              static final String[] DAY_SHORT = {"Pzt", "Sal", "Çar", "Per", "Cum", "Cmt", "Paz"};

              JSONObject toJson() throws JSONException {
                  JSONObject o = new JSONObject();
                  o.put("id", id);
                  o.put("h", hour);
                  o.put("m", minute);
                  o.put("d", days);
                  o.put("e", enabled);
                  return o;
              }

              static Alarm fromJson(JSONObject o) {
                  Alarm a = new Alarm();
                  a.id = o.optInt("id");
                  a.hour = o.optInt("h");
                  a.minute = o.optInt("m");
                  a.days = o.optInt("d");
                  a.enabled = o.optBoolean("e", true);
                  return a;
              }

              String timeText() {
                  return String.format("%02d:%02d", hour, minute);
              }

              String daysText() {
                  if (days == 0) return "Bir kez";
                  if (days == 0x7F) return "Her gün";
                  if (days == 0x1F) return "Hafta içi";
                  if (days == 0x60) return "Hafta sonu";
                  StringBuilder sb = new StringBuilder();
                  for (int i = 0; i < 7; i++) {
                      if ((days & (1 << i)) != 0) {
                          if (sb.length() > 0) sb.append(", ");
                          sb.append(DAY_SHORT[i]);
                      }
                  }
                  return sb.toString();
              }

              /** Calendar.DAY_OF_WEEK -> bizim bit sıramız (Pzt=0). */
              static int dayIndex(Calendar c) {
                  int dow = c.get(Calendar.DAY_OF_WEEK); // Pazar=1 ... Cumartesi=7
                  return (dow + 5) % 7;
              }

              /** Şu andan sonraki ilk çalma zamanı (ms). */
              long nextTrigger(long now) {
                  Calendar c = Calendar.getInstance();
                  c.setTimeInMillis(now);
                  c.set(Calendar.HOUR_OF_DAY, hour);
                  c.set(Calendar.MINUTE, minute);
                  c.set(Calendar.SECOND, 0);
                  c.set(Calendar.MILLISECOND, 0);
                  if (days == 0) {
                      if (c.getTimeInMillis() <= now) c.add(Calendar.DAY_OF_YEAR, 1);
                      return c.getTimeInMillis();
                  }
                  for (int i = 0; i < 8; i++) {
                      if (c.getTimeInMillis() > now && (days & (1 << dayIndex(c))) != 0) {
                          return c.getTimeInMillis();
                      }
                      c.add(Calendar.DAY_OF_YEAR, 1);
                  }
                  return c.getTimeInMillis();
              }
          }
          EOF_FILE
          mkdir -p app/src/main/java/com/kero/titresimalarm
          cat > app/src/main/java/com/kero/titresimalarm/AlarmActivity.java <<'EOF_FILE'
          package com.kero.titresimalarm;

          import android.app.Activity;
          import android.content.Intent;
          import android.graphics.Color;
          import android.graphics.drawable.GradientDrawable;
          import android.os.Bundle;
          import android.view.Gravity;
          import android.view.WindowManager;
          import android.widget.Button;
          import android.widget.LinearLayout;
          import android.widget.TextView;

          import java.lang.ref.WeakReference;
          import java.text.SimpleDateFormat;
          import java.util.Date;
          import java.util.Locale;

          /** Kilit ekranının üstünde açılan "Kapat / Ertele" ekranı. */
          public class AlarmActivity extends Activity {
              private static WeakReference<AlarmActivity> open = new WeakReference<>(null);

              static void closeIfOpen() {
                  AlarmActivity a = open.get();
                  if (a != null) a.runOnUiThread(a::finish);
              }

              @Override
              protected void onCreate(Bundle b) {
                  super.onCreate(b);
                  open = new WeakReference<>(this);
                  setShowWhenLocked(true);
                  setTurnScreenOn(true);
                  getWindow().addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON);

                  if (!AlarmService.ringing) {
                      finish();
                      return;
                  }

                  float dp = getResources().getDisplayMetrics().density;
                  LinearLayout root = new LinearLayout(this);
                  root.setOrientation(LinearLayout.VERTICAL);
                  root.setGravity(Gravity.CENTER);
                  root.setBackgroundColor(Color.rgb(16, 20, 40));
                  int pad = (int) (24 * dp);
                  root.setPadding(pad, pad, pad, pad);

                  TextView time = new TextView(this);
                  time.setText(new SimpleDateFormat("HH:mm", Locale.getDefault()).format(new Date()));
                  time.setTextSize(84);
                  time.setTextColor(Color.WHITE);
                  time.setGravity(Gravity.CENTER);
                  root.addView(time);

                  TextView sub = new TextView(this);
                  sub.setText("Alarm");
                  sub.setTextSize(22);
                  sub.setTextColor(Color.rgb(255, 200, 87));
                  sub.setGravity(Gravity.CENTER);
                  sub.setPadding(0, 0, 0, (int) (48 * dp));
                  root.addView(sub);

                  Button stop = bigButton("KAPAT", Color.rgb(230, 70, 70), dp);
                  stop.setOnClickListener(v -> send(AlarmService.ACTION_STOP));
                  root.addView(stop);

                  Button snooze = bigButton(Store.snoozeMinutes(this) + " DK ERTELE", Color.rgb(60, 70, 120), dp);
                  snooze.setOnClickListener(v -> send(AlarmService.ACTION_SNOOZE));
                  LinearLayout.LayoutParams lp = (LinearLayout.LayoutParams) snooze.getLayoutParams();
                  lp.topMargin = (int) (16 * dp);
                  root.addView(snooze);

                  setContentView(root);
              }

              private Button bigButton(String text, int color, float dp) {
                  Button btn = new Button(this);
                  btn.setText(text);
                  btn.setTextSize(22);
                  btn.setTextColor(Color.WHITE);
                  GradientDrawable bg = new GradientDrawable();
                  bg.setColor(color);
                  bg.setCornerRadius(20 * dp);
                  btn.setBackground(bg);
                  btn.setLayoutParams(new LinearLayout.LayoutParams(
                          LinearLayout.LayoutParams.MATCH_PARENT, (int) (80 * dp)));
                  return btn;
              }

              private void send(String action) {
                  Intent i = new Intent(this, AlarmService.class);
                  i.setAction(action);
                  startService(i);
                  finish();
              }

              @Override
              protected void onDestroy() {
                  if (open.get() == this) open = new WeakReference<>(null);
                  super.onDestroy();
              }
          }
          EOF_FILE
